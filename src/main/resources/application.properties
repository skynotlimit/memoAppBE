# ===== 서버 =====
server.port=8080

# ===== Datasource (MySQL) =====
# MySQL 설치 후 아래 접속 정보에 맞게 수정하세요.
spring.datasource.url=jdbc:mysql://localhost:3307/memo_db?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=memo_user
spring.datasource.password=memo1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== Jackson =====
spring.jackson.serialization.write-dates-as-timestamps=false
